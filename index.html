<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Abyss by Zeta</title>
<meta name="description" content="Aquí no llega el sol. Nadie está iluminado: cada cuerpo existe sólo hasta donde llega la luz que le dan, y el que tiende la trampa es el que vive más a oscuras.">
<link rel="stylesheet" href="marco.css">
<!-- INSTALABLE EN LA PANTALLA DE INICIO. `background_color` y el
     `theme_color` son el mismo #000103 del `body` en marco.css: es lo que
     pinta el sistema mientras arranca, y cualquier otro color da un
     fogonazo antes del abismo.

     OJO CON `orientation: portrait`: la pieza NO gira el cuadro y se ve
     en las dos posturas a propósito —hay valores de la escena ajustados
     mirándola tumbada—. Instalada, esto la clava de pie. Para recuperar
     el apaisado basta con poner "any". -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono.svg" type="image/svg+xml">
</head>
<body>
<!-- LA CHAPA. El abismo vive dentro de #pecera y no puede pintar fuera:
     el lienzo es más pequeño que la pantalla, así que el marco y la
     franja de abajo están a salvo por construcción y no por recortes. -->
<div id="marco">
  <div id="pecera"><canvas id="acuario"></canvas></div>
  <footer id="pie">
    <h1 id="titulo">Abyss <i>by</i> Zeta</h1>
    <nav id="mandos">
      <button id="acerca" type="button" aria-haspopup="dialog">acerca de</button>
      <button id="reinicia" type="button">reiniciar</button>
    </nav>
  </footer>
</div>

<!-- ACERCA DE. Va FUERA de #marco a propósito: un diálogo modal se pinta
     en la capa de encima, así que no lo recorta nada, y colgando del
     <body> no hereda el `container-type` de la chapa —la ficha se mide
     contra la PANTALLA, y el título de la franja contra el cuadro—.
     El <dialog> no lleva relleno y todo su interior es el <article>:
     de ahí sale el clic fuera que lo cierra (marco.js). -->
<dialog id="acercade" aria-labelledby="rotulo">
  <article>
    <img src="icono.svg" alt="" width="512" height="512">
    <h2 id="rotulo">Abyss <i>by</i> Zeta</h2>
    <p>Aquí el abismo no solo te devuelve la mirada.</p>
    <p class="firma">Arte generativo · Ningún pez fue dañado en el proceso · El anglerfish solo quiere jugar</p>
    <button id="cierra" type="button">cerrar</button>
  </article>
</dialog>

<!-- La pieza. abismo.js tira del resto por imports: motor.js, escena.js
     y el catálogo de bichos/ y eventos/. marco.js sólo cablea los
     botones de la franja. -->
<script type="module" src="abismo.js"></script>
<script type="module" src="marco.js"></script>

<!-- PANEL DE PRUEBAS · no forma parte de la pieza: borra esta línea
     y desaparece. Va al final porque lee la escena viva. Se abre con
     la tecla P o con ?pruebas -->
<script type="module" src="pruebas.js"></script>
</body>
</html>
