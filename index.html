<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Abyss by Zeta</title>
<meta name="description" content="Aquí no llega el sol. Nadie está iluminado: cada cuerpo existe sólo hasta donde llega la luz que le dan, y el que tiende la trampa es el que vive más a oscuras.">
<link rel="stylesheet" href="marco.css">
</head>
<body>
<!-- LA CHAPA. El abismo vive dentro de #pecera y no puede pintar fuera:
     el lienzo es más pequeño que la pantalla, así que el marco y la
     franja de abajo están a salvo por construcción y no por recortes. -->
<div id="marco">
  <div id="pecera"><canvas id="acuario"></canvas></div>
  <footer id="pie">
    <h1 id="titulo">Abyss <i>by</i> Zeta</h1>
    <nav id="mandos">
      <button id="girar" type="button" hidden>tumbar</button>
      <button id="reinicia" type="button">reiniciar</button>
    </nav>
  </footer>
</div>

<!-- La pieza. abismo.js tira del resto por imports: motor.js, escena.js
     y el catálogo de bichos/ y eventos/. marco.js sólo cablea los dos
     botones de la franja. -->
<script type="module" src="abismo.js"></script>
<script type="module" src="marco.js"></script>

<!-- PANEL DE PRUEBAS · no forma parte de la pieza: borra esta línea
     y desaparece. Va al final porque lee la escena viva. Se abre con
     la tecla P o con ?pruebas -->
<script type="module" src="pruebas.js"></script>
</body>
</html>
