<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<!-- EL ICONO ES LA PIEZA, con su propia anatomía y no un dibujo
     parecido: la curva del cuerpo, el ojo desproporcionado de mictófido y
     la hilera de fotóforos son los mismos números que bichos/pezlinterna.js
     —PANZA, DENTRO, FOTO_T—, y el agua es el degradado de ABISMO.agua.tono.

     Va en SVG y no en PNG porque la pieza no tiene binarios: sin build y
     sin dependencias, un icono que se lee en texto encaja y escala solo.
     El pez cabe dentro del 80 % central, así que el recorte a círculo de
     Android no le quita ni el morro ni la cola. -->
